name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol layer (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cantools
        run: pip install "cantools>=39"

      # validate        database integrity + bus load budget
      # check-generated committed C still matches bfmc.dbc
      # test            round-trip, scaling, range, frame IDs
      # cross-check     generated C encoder vs the cantools encoder
      - name: Run all host checks
        run: make all

  firmware:
    name: Gateway firmware (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      # Every combination of bus topology and run mode is compiled. A change
      # that breaks only the dual-CAN path, or only the application build,
      # would otherwise go unnoticed until someone wired up a bus.
      - name: Build all configurations
        run: |
          for topology in loopback dual; do
            for run in bringup app; do
              bash tools/build_firmware.sh "$topology" "$run"
            done
          done

      # The application build must actually link the tested logic. Without this,
      # a wiring mistake that left bfmc_app.c calling nothing would still
      # produce a green build and an ELF that does nothing.
      - name: Check the application links the safety and protocol layers
        run: |
          set -e
          elf=build/firmware-loopback-app/gateway.elf
          for sym in CmdMonitor_Poll Heartbeat_Poll MotionSafety_Update \
                     bfmc_motion_cmd_pack bfmc_motion_cmd_unpack; do
            if ! arm-none-eabi-nm "$elf" | grep -q " T $sym$"; then
              echo "ERROR: $sym missing from $elf" >&2
              exit 1
            fi
            echo "ok $sym"
          done
          # And the bring-up build must not carry any of it.
          bringup=build/firmware-loopback-bringup/gateway.elf
          if arm-none-eabi-nm "$bringup" | grep -qE "CmdMonitor|MotionSafety|bfmc_motion_cmd"; then
            echo "ERROR: bring-up build unexpectedly links the application layer" >&2
            exit 1
          fi
          echo "ok bring-up build is free of application code"

      - uses: actions/upload-artifact@v4
        with:
          name: gateway-elf
          path: build/firmware-*/gateway.elf
          if-no-files-found: error
